<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator</title>
    <script src="kalkulator.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: lightgray;
            margin: 0;
        }

        #kalkulator {
            background-color: #222222;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0px 15px 40px rgba(0, 0, 0, 1);
            width: 457px;
        }

        #tekst{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align:center;
            font-size: 18px;
            color: #757575;
        }

        #ekran {
            width: 92%;
            height: 80px;
            background-color: #333;
            color:#757575;
            text-align: right;
            font-size: 50px;
            border: none;
            border-radius: 15px;
            padding: 10px;
            margin-bottom: 25px;
        }

        button {
            width: 80px;
            height: 80px;
            font-size: 35px;
            background-color: #555555;
            border: none;
            border-radius: 15px;
            margin: 15px;
            cursor: pointer;
            box-shadow: 0px 15px 40px rgba(0, 0, 0, 0.3);
            transition: background-color 0.3s ease, transform 0.1s;
        }

        button:hover {
            background-color: #777777;
        }

        button:active {
            background-color: #AAAAAA;
            transform: scale(0.95);
        }

        #wyczysc {
            background-color: red;
            color: #fff;
        }

        #rownosc {
            background-color: white;
            color: #000000;
        }

        #dzialania {
            background-color: #000000;
            color: #fff;
        }

        button#wyczysc:hover, button#rownosc:hover, button#dzialania:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div id="kalkulator"> 
    <div id="tekst">Popek-alkulator</div>                                                   
    <input type="text" id="ekran" disabled placeholder="0">             
    <br>                                                                
    <button id="wyczysc" onclick="clearDisplay()">C</button>            
    <button onclick="appendToDisplay('1')">1</button>                   
    <button onclick="appendToDisplay('2')">2</button>                   
    <button onclick="appendToDisplay('3')">3</button>                   
    <br>                                                                
    <button id="dzialania" onclick="appendToDisplay('+')">+</button>    
    <button onclick="appendToDisplay('4')">4</button>                   
    <button onclick="appendToDisplay('5')">5</button>                   
    <button onclick="appendToDisplay('6')">6</button>                   
    <br>                                                                
    <button id="dzialania" onclick="appendToDisplay('-')">-</button>    
    <button onclick="appendToDisplay('7')">7</button>                   
    <button onclick="appendToDisplay('8')">8</button>                   
    <button onclick="appendToDisplay('9')">9</button>                   
    <br>                                                                
    <button id="dzialania" onclick="appendToDisplay('*')">*</button>    
    <button onclick="appendToDisplay('0')">0</button>                   
    <button id="dzialania" onclick="appendToDisplay('/')">/</button>    
    <button id="dzialania" onclick="appendToDisplay('**')">^</button>   
    <button id="rownosc" onclick="calculateResult()">=</button>         
    <button id="dzialania" onclick="calculateSquareRoot()">√</button>    
</div>

<footer>
    <div id="cpright"></div>
</footer>

</body>
</html>
