<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator</title>
    <script src="kalkulator.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
        }

        #kalkulator {
            background-color: #222222;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.2);
            width: 350px;
        }

        #ekran {
            width: 100%;
            height: 60px;
            background-color: #333;
            color: #666;
            text-align: right;
            font-size: 40px;
            border: none;
            border-radius: 10px;
            padding: 8px 0px;
            margin-bottom: 20px;
        }

        button {
            width: 70px;
            height: 70px;
            font-size: 30px;
            background-color: #555555;
            border: none;
            border-radius: 10px;
            margin: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #777777;
        }

        button:active {
            background-color: #AAAAAA;
        }

        #wyczysc {
            background-color: #ff6666;
            color: #fff;
        }

        #rownosc {
            background-color: white;
            color: #000000;
        }

        #dzialania {
            background-color: #000000;
            color: #fff;
        }

        button#wyczysc:hover, button#rownosc:hover, button#dzialania:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div id="kalkulator">                                                   <!--- ciało kalkulatora, w którym dzieje się wszystko co ma się dziać-->
    <input type="text" id="ekran" disabled placeholder="0">             <!--- wyświetlacz wyniku, czyli ekranik na którym wszystko się pokaże-->
    <br>                                                                <!--- oddzielenie guzikow od siebie o jedna linijke numer 1-->
    <button id="wyczysc" onclick="clearDisplay()">C</button>            <!--- guzik wyczyszczenia, czyli jak cos popsujesz to juz tego nie będzie-->
    <button onclick="appendToDisplay('1')">1</button>                   <!--- guzik jedynki, czyli po kliknięciu pokaże się jeden-->
    <button onclick="appendToDisplay('2')">2</button>                   <!--- guzik dwójki, czyli po kliknięciu pokaże się dwa-->
    <button onclick="appendToDisplay('3')">3</button>                   <!--- guzik trójki, czyli po kliknięciu pokaże się trzy-->
    <br>                                                                <!--- oddzielenie guzikow od siebie o jedna linijke numer 2-->
    <button id="dzialania" onclick="appendToDisplay('+')">+</button>    <!--- guzik dodawania, czyli po wciśnięciu będzie dodawać liczby-->
    <button onclick="appendToDisplay('4')">4</button>                   <!--- guzik czwórki, czyli po kliknięciu pokaże się cztery-->
    <button onclick="appendToDisplay('5')">5</button>                   <!--- guzik piątki, czyli po kliknięciu pokaże się pięć-->
    <button onclick="appendToDisplay('6')">6</button>                   <!--- guzik szóstki, czyli po kliknięciu pokaże się sześć-->
    <br>                                                                <!--- oddzielenie guzikow od siebie o jedna linijke numer 3-->
    <button id="dzialania" onclick="appendToDisplay('-')">-</button>    <!--- guzik odejmowania, czyli po wciśnięciu odejmie od jednej liczby drugą-->
    <button onclick="appendToDisplay('7')">7</button>                   <!--- guzik siódemki, czyli po kliknięciu pokaże się siedem-->
    <button onclick="appendToDisplay('8')">8</button>                   <!--- guzik ósemki, czyli po kliknięciu pokaże się osiem-->
    <button onclick="appendToDisplay('9')">9</button>                   <!--- guzik dziewiątki, czyli po kliknięciu pokaże się dziewięć-->
    <br>                                                                <!--- oddzielenie guzikow od siebie o jedna linijke numer 4-->
    <button id="dzialania" onclick="appendToDisplay('*')">*</button>    <!--- guzik mnożenia, czyli po wciśnięciu pomnoży pierwszą liczbę przez drugą-->
    <button onclick="appendToDisplay('0')">0</button>                   <!--- guzik zerowania, czyli po kliknięciu pokaże się zero-->
    <button id="dzialania" onclick="appendToDisplay('/')">/</button>    <!--- guzik dzielenia, czyli po wciśnięciu podzieli pierwszą liczbę przez drugą, ale jak druga liczba będzie 0 to nie zadziała i pokaże błąd-->
    <button id="dzialania" onclick="appendToDisplay('**')">^</button>   <!--- guzik potęgowania, czyli po wciśnięciu pomnoży pierwszą liczbę przez samą siebie tyle razy, jaki będzie miała cała liczba druga-->
    <button id="rownosc" onclick="calculateResult()">=</button>         <!--- guzik wyniku, czyli po wciśnięciu poda wynik całego podanego działania-->
</div>
</body>
</html>
